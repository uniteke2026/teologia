<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Administração | UNITEKE Connect</title><style>
:root{--navy:#10284e;--blue:#356794;--line:#dce5ef;--muted:#5b7189;--surface:#f4f7fb}*{box-sizing:border-box}body{margin:0;background:var(--surface);color:var(--navy);font:15px/1.5 Inter,-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,sans-serif}header{background:var(--navy);color:white}nav{max-width:1160px;margin:auto;padding:20px 24px;display:flex;align-items:center;justify-content:space-between;gap:12px}nav img{width:clamp(145px,35vw,260px);vertical-align:middle}nav a{color:white;text-decoration:none}main{max-width:1160px;margin:32px auto;padding:0 24px}h1,h2,h3,p{margin:0 0 10px}h1{font-size:clamp(26px,4vw,38px);letter-spacing:-.04em}h2{font-size:22px}button,input,select,textarea{font:inherit}button{cursor:pointer}.btn{background:var(--blue);border:1px solid var(--blue);color:white;border-radius:8px;padding:10px 14px;font-weight:650}.secondary{background:white;color:var(--navy);border:1px solid var(--line)}.danger{background:white;color:#a32828;border-color:#e5caca}.box{border:1px solid var(--line);border-radius:13px;background:white;padding:20px;margin-bottom:18px}.login{max-width:440px;margin:55px auto}.muted{color:var(--muted)}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin:24px 0}.stat{background:white;border:1px solid var(--line);border-radius:12px;padding:18px}.stat strong{font-size:30px;display:block;letter-spacing:-.06em}.row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}.between{justify-content:space-between}.entry{border-top:1px solid var(--line);padding:16px 0;display:grid;grid-template-columns:130px 1fr;gap:16px}.entry img{width:100%;aspect-ratio:16/9;object-fit:cover;border-radius:8px;background:var(--surface)}.actions{display:flex;flex-wrap:wrap;gap:7px;margin-top:9px}.actions button{font-size:13px}.tag{background:var(--surface);padding:3px 8px;border-radius:6px;font-size:12px}.hidden{display:none!important}label{display:block;font-weight:650;margin:12px 0}input,select,textarea{display:block;width:100%;padding:10px;border:1px solid var(--line);border-radius:8px;background:white;color:var(--navy);margin-top:4px}.filters{display:grid;grid-template-columns:2fr 1fr;gap:10px;margin:12px 0}.error{color:#a32828;min-height:20px}.msg{color:var(--muted);min-height:20px}dialog{width:min(540px,95vw);max-height:92vh;border:0;border-radius:14px;padding:22px;color:var(--navy)}dialog::backdrop{background:#10284e99}.report{padding:15px 0;border-top:1px solid var(--line)}@media(max-width:650px){main{padding:0 14px;margin-top:20px}.grid{grid-template-columns:1fr 1fr}.entry{grid-template-columns:95px 1fr}.filters{grid-template-columns:1fr}nav{padding:14px}.box{padding:15px}.stat{padding:12px}}
</style></head><body><header><nav><a href="./"><img src="logo.webp" alt="UNITEKE — Teologia Bíblica e Pentecostal"></a><a href="./">← Vitrine</a></nav></header><main><section id="login" class="box login"><h1>Área administrativa</h1><p class="muted">Acesso reservado à secretaria da UNITEKE.</p><form id="loginForm"><label>Usuário<input name="username" autocomplete="username" maxlength="80" required></label><label>Senha<input name="password" type="password" autocomplete="current-password" maxlength="256" required></label><p id="loginError" class="error" role="alert"></p><button class="btn" type="submit">Entrar</button></form></section><section id="panel" class="hidden"><div class="row between"><div><p class="muted">UNITEKE CONNECT / ADMINISTRAÇÃO</p><h1>Gestão de negócios</h1><p class="muted" id="user"></p></div><button class="btn secondary" id="logout">Sair</button></div><div class="grid" id="stats"></div><p id="message" class="msg" aria-live="polite"></p><section class="box"><div class="row between"><h2>Empresas e serviços</h2><button class="btn secondary" id="refresh">Atualizar</button></div><div class="filters"><input id="search" placeholder="Buscar negócio, aluno ou WhatsApp" aria-label="Buscar"><select id="filter" aria-label="Filtrar status"><option value="all">Todos os status</option><option value="1">Publicados</option><option value="0">Não publicados</option></select></div><div id="businesses"></div></section><section class="box"><h2>Denúncias</h2><p class="muted">Acompanhe e resolva as denúncias recebidas.</p><div id="reports"></div></section></section></main><dialog id="edit"><div class="row between"><h2>Editar anúncio</h2><button class="btn secondary" id="cancel">Fechar</button></div><form id="editForm"><input name="id" type="hidden"><label>Aluno (privado)<input name="student" maxlength="120" required></label><label>Nome comercial<input name="name" maxlength="100" required></label><label>Categoria<select name="category" required id="cats"></select></label><label>Descrição<textarea name="description" maxlength="280" rows="2"></textarea></label><label>WhatsApp (55 + DDD + número)<input name="whatsapp" maxlength="13" required></label><label>Instagram (sem @)<input name="instagram" maxlength="30"></label><label>Site da empresa (opcional)<input name="company_site" maxlength="500" placeholder="www.suaempresa.com.br" inputmode="url" autocomplete="url"></label><label>Substituir banner (opcional)<input id="newBanner" type="file" accept="image/jpeg,image/png,image/webp"></label><p id="editError" class="error" role="alert"></p><button class="btn">Salvar alterações</button></form></dialog><script src="supabase-config.js"></script><script>
const $=s=>document.querySelector(s),cats=['Alimentação','Beleza e estética','Comércio','Construção e reformas','Educação','Eventos','Moda e acessórios','Saúde e bem-estar','Serviços profissionais','Tecnologia','Transporte','Outros'];let state={businesses:[],reports:[],csrf:''};const el=(t,c,s)=>{let e=document.createElement(t);if(c)e.className=c;if(s!==undefined)e.textContent=s;return e};for(let c of cats){let o=el('option','',c);o.value=c;$('#cats').append(o)}function btn(t,f,c='secondary'){let b=el('button','btn '+c,t);b.type='button';b.onclick=f;return b}let accessToken=sessionStorage.getItem('connect-admin-token')||'';
async function api(path,data){
 if(path==='login'){
  let r=await fetch(CONNECT_URL+'/auth/v1/token?grant_type=password',{method:'POST',headers:{apikey:CONNECT_KEY,'Content-Type':'application/json'},body:JSON.stringify({email:data.username.trim(),password:data.password})});
  let x=await r.json();if(!r.ok||!x.access_token)throw Error('E-mail ou senha inválidos, ou acesso indisponível.');accessToken=x.access_token;sessionStorage.setItem('connect-admin-token',accessToken);return x;
 }
 if(path==='logout'){try{if(accessToken)await fetch(CONNECT_URL+'/auth/v1/logout?scope=local',{method:'POST',headers:{apikey:CONNECT_KEY,Authorization:'Bearer '+accessToken}});}finally{accessToken='';sessionStorage.removeItem('connect-admin-token');}return {};}
 if(!accessToken)throw Error('Entre com seu e-mail e senha.');
 let r=await connectRequest(path,data||{},accessToken),x=await r.json();if(!r.ok){if(r.status===401||r.status===403){accessToken='';sessionStorage.removeItem('connect-admin-token');showLogin();}throw Error(x.error||'Erro inesperado');}return x;
}
function showLogin(){$('#panel').classList.add('hidden');$('#login').classList.remove('hidden');state={businesses:[],reports:[],csrf:''};$('#businesses').replaceChildren();$('#reports').replaceChildren()}async function load(){state=await api('admin');$('#login').classList.add('hidden');$('#panel').classList.remove('hidden');$('#user').textContent='Acesso: '+state.username;render()}function notify(s){$('#message').textContent=s}async function change(path,data){try{await api(path,data);await load();notify('Alteração realizada.')}catch(e){notify(e.message)}}function date(t){return new Date(t*1000).toLocaleString('pt-BR')}function render(){let active=state.businesses.filter(x=>x.active).length;$('#stats').replaceChildren();for(let [v,k] of [[state.businesses.length,'Cadastros'],[active,'Publicados'],[state.businesses.length-active,'Não publicados'],[state.reports.filter(x=>!x.resolved).length,'Denúncias abertas']]){let s=el('div','stat');s.append(el('strong','',v),el('span','muted',k));$('#stats').append(s)}let q=$('#search').value.toLowerCase(),f=$('#filter').value,rows=state.businesses.filter(x=>(f==='all'||String(Number(x.active))===f)&&[x.name,x.student,x.whatsapp,x.category,x.company_site].join(' ').toLowerCase().includes(q));let target=$('#businesses');target.replaceChildren();if(!rows.length)target.append(el('p','muted','Nenhum cadastro encontrado.'));for(let x of rows){let e=el('article','entry'),i=el('img');i.src=x.banner;i.alt='Banner de '+x.name;i.loading='lazy';let d=el('div');let head=el('div','row');head.append(el('strong','',x.name),el('span','tag',x.active?'Publicado':'Não publicado'));d.append(head,el('p','muted',x.category+' · '+date(x.created)),el('p','','Aluno: '+x.student+' · WhatsApp: +'+x.whatsapp),el('p','muted',x.description||''));if(x.company_site){try{let site=normalizeCompanySite(x.company_site);if(site){let link=el('a','muted',site);link.href=site;link.target='_blank';link.rel='noopener noreferrer';let row=el('p','','Site: ');row.append(link);d.append(row)}}catch{}}let a=el('div','actions');a.append(btn('Editar',()=>openEdit(x)),btn(x.active?'Ocultar':'Publicar',()=>change('admin/status',{id:x.id,active:!x.active})),btn('Excluir',()=>{if(confirm('Excluir definitivamente este cadastro e suas denúncias?'))change('admin/delete',{id:x.id})},'danger'));d.append(a);e.append(i,d);target.append(e)}let reports=$('#reports');reports.replaceChildren();if(!state.reports.length)reports.append(el('p','muted','Nenhuma denúncia.'));for(let x of state.reports){let r=el('div','report');r.append(el('strong','',x.business_name),el('p','muted',date(x.created)+' · '+(x.resolved?'Resolvida':'Aberta')),el('p','',x.reason));if(!x.resolved)r.append(btn('Marcar como resolvida',()=>change('admin/report',{id:x.id})));reports.append(r)}}function openEdit(x){let f=$('#editForm');f.reset();for(let k of ['id','student','name','category','description','whatsapp','instagram','company_site'])f.elements[k].value=x[k]||'';$('#editError').textContent='';$('#edit').showModal()}$('#loginForm').onsubmit=async e=>{e.preventDefault();let b=e.target.querySelector('button');b.disabled=true;$('#loginError').textContent='';try{await api('login',Object.fromEntries(new FormData(e.target)));e.target.reset();await load()}catch(e){$('#loginError').textContent=e.message}finally{b.disabled=false}};$('#logout').onclick=async()=>{try{await api('logout',{});showLogin()}catch(e){notify(e.message)}};$('#refresh').onclick=()=>load().catch(e=>notify(e.message));$('#search').oninput=render;$('#filter').onchange=render;$('#cancel').onclick=()=>$('#edit').close();$('#editForm').onsubmit=async e=>{e.preventDefault();let b=e.target.querySelector('button');b.disabled=true;try{let d=Object.fromEntries(new FormData(e.target)),f=$('#newBanner').files[0];if(f){if(f.size>5*1024*1024||!['image/jpeg','image/png','image/webp'].includes(f.type))throw Error('Banner inválido.');d.banner=await new Promise((resolve,reject)=>{let r=new FileReader();r.onload=()=>resolve(r.result);r.onerror=reject;r.readAsDataURL(f)})}d.whatsapp=d.whatsapp.replace(/\D/g,'');if(d.whatsapp.length===10||d.whatsapp.length===11)d.whatsapp='55'+d.whatsapp;d.instagram=d.instagram.trim().replace(/^@/,'');d.company_site=normalizeCompanySite(d.company_site);await api('admin/edit',d);$('#edit').close();await load();notify('Cadastro atualizado.')}catch(e){$('#editError').textContent=e.message}finally{b.disabled=false}};load().catch(()=>showLogin());
</script></body></html>
