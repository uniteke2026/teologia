    <style id="connect-compact-directory">
      /* Kerigma Connect directory v2: compact discovery, complete detail. */
      #vitrine .grid[aria-live="polite"], #vitrine .grid[aria-label="Carregando anúncios"] {
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 10px;
        align-items: stretch;
      }
      @media (min-width: 640px) {
        #vitrine .grid[aria-live="polite"], #vitrine .grid[aria-label="Carregando anúncios"] {
          grid-template-columns: repeat(3, minmax(0, 1fr));
          gap: 16px;
        }
      }
      @media (min-width: 1024px) {
        #vitrine .grid[aria-live="polite"], #vitrine .grid[aria-label="Carregando anúncios"] {
          grid-template-columns: repeat(4, minmax(0, 1fr));
          gap: 20px;
        }
      }
      #vitrine .kc-summary {
        display: flex;
        flex-direction: column;
        min-width: 0;
        border-radius: 16px;
        overflow: hidden;
        background: #fff;
        transition: border-color .2s, box-shadow .2s;
      }
      #vitrine .kc-summary:hover { border-color: #9bb5d0; box-shadow: 0 6px 22px #10284e0d; }
      .kc-summary-cover { width: 100%; flex-shrink: 0; cursor: pointer; }
      .kc-summary-body { display: flex; flex: 1; flex-direction: column; gap: 6px; padding: 12px; min-width: 0; }
      .kc-summary-category { font-size: 10px; line-height: 1.4; font-weight: 650; text-transform: uppercase; letter-spacing: .065em; color: #527499; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
      .kc-summary-name, .kc-summary-description {
        display: -webkit-box; -webkit-box-orient: vertical; -webkit-line-clamp: 2;
        overflow: hidden; overflow-wrap: anywhere; margin: 0;
      }
      .kc-summary-name { font-size: 17px; line-height: 1.18; height: 2.36em; font-weight: 700; }
      .kc-summary-description { font-size: 12px; line-height: 1.45; height: 2.9em; color: #53687d; }
      .kc-summary-location { display:flex; align-items:center; gap: 4px; min-height: 1.4em; font-size: 11px; line-height: 1.4; color: #53687d; min-width:0; margin: 1px 0 4px; }
      .kc-summary-location span { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
      .kc-location-icon { width: 13px; height: 13px; flex: 0 0 13px; color: #527499; }
      .kc-open-business {
        display:flex; align-items:center; justify-content:space-between; gap:4px;
        width:100%; margin-top:auto; min-height:42px; padding: 8px 10px;
        border-radius: 10px; background: #10284e; color: #fff;
        border: 1px solid #10284e; font-size: 12px; font-weight: 650;
        line-height:1.25; text-align:left; cursor:pointer; transition: background .2s;
      }
      .kc-open-business:hover { background:#356794; border-color:#356794; }
      .kc-open-business:focus-visible, .kc-dialog-close:focus-visible { outline: 2px solid #6ea6dd; outline-offset: 2px; }
      .kc-open-business span:last-child { font-size:15px; flex-shrink:0; }
      #vitrine .grid[aria-label="Carregando anúncios"] > div { min-width:0; border-radius:16px; }
      #vitrine .grid[aria-label="Carregando anúncios"] > div > div:nth-child(2) { padding:12px; overflow:hidden; }
      #vitrine .grid[aria-label="Carregando anúncios"] > div > div:nth-child(2) * { max-width:100%; }
      .kc-business-dialog:not([open]) { display:none; }
      .kc-business-dialog {
        position:fixed; inset:0; margin:auto; padding:0;
        width:min(940px, calc(100vw - 48px)); max-width:none;
        max-height:calc(100dvh - 48px); overflow-y:auto; overscroll-behavior:contain;
        border:1px solid #dbe5ef; border-radius:22px; color:#10284e; background:#fff;
        box-shadow:0 28px 96px #07172e55;
      }
      .kc-business-dialog::backdrop { background: #07172e99; backdrop-filter:blur(5px); }
      .kc-dialog-header {
        position:sticky; top:0; z-index:30; display:flex; align-items:center; justify-content:space-between; gap:12px;
        padding:14px 22px; background:#fff; border-bottom:1px solid #dce5ef;
      }
      .kc-dialog-header > span { font-size:11px; font-weight:700; letter-spacing:.14em; color:#356794; }
      .kc-dialog-close {
        display:grid; place-items:center; flex:0 0 38px; width:38px; height:38px; border-radius:50%;
        background:#f4f7fb; color:#10284e; border:1px solid #dce5ef; font-size:26px; line-height:1; cursor:pointer;
      }
      .kc-dialog-close:hover { background:#e7eff8; }
      #vitrine .kc-business-dialog > article {
        border:0; border-radius:0; box-shadow:none; overflow:visible; display:grid;
        grid-template-columns:minmax(0, 310px) minmax(0, 1fr); gap:0;
        align-items:start; padding:20px; background:#fff;
      }
      #vitrine .kc-business-dialog > article > div:first-child { border-radius:14px; overflow:hidden; }
      #vitrine .kc-business-dialog > article > div:nth-child(2) { padding:4px 4px 12px 24px; gap:18px; }
      #vitrine .kc-business-dialog h3 { font-size:clamp(22px, 3vw, 32px); line-height:1.12; }
      #vitrine .kc-business-dialog a[href*="wa.me"] { flex:0 0 100%; width:100%; }
      #vitrine .kc-business-dialog > article > div:nth-child(2) > div:last-child a,
      #vitrine .kc-business-dialog > article > div:nth-child(2) > div:last-child button { white-space:normal; }
      @media (max-width:639px) {
        #vitrine .kc-summary { border-radius:11px; }
        .kc-summary-body { padding:9px; gap:5px; }
        .kc-summary-category { font-size:9px; letter-spacing:.035em; }
        .kc-summary-name { font-size:14px; }
        .kc-summary-description { font-size:11px; }
        .kc-summary-location { font-size:10px; }
        .kc-open-business { padding:7px; border-radius:8px; font-size:11px; min-height:44px; }
        .kc-open-business span:last-child { font-size:13px; }
        .kc-summary-cover [aria-label="Foto anterior"], .kc-summary-cover [aria-label="Próxima foto"] { width:28px; height:32px; }
        .kc-summary-cover [aria-label="Foto anterior"] { left:4px; }
        .kc-summary-cover [aria-label="Próxima foto"] { right:4px; }
        .kc-summary-cover [role="tablist"] { left:6px; right:6px; gap:3px; }
        .kc-business-dialog { width:100%; height:100dvh; max-height:100dvh; border:0; border-radius:0; }
        .kc-dialog-header { padding:10px 16px; }
        #vitrine .kc-business-dialog > article { display:flex; flex-direction:column; align-items:stretch; padding:16px; gap:20px; }
        #vitrine .kc-business-dialog > article > div:first-child { width:min(100%, 260px); margin:0 auto; }
        #vitrine .kc-business-dialog > article > div:nth-child(2) { padding:0 0 18px; gap:16px; }
      }
      @media (prefers-reduced-motion:reduce) { .kc-summary, .kc-open-business { transition:none!important; } }
    </style>
  <style id="kch-production-style">
.kch-hero{position:relative;isolation:isolate;overflow:hidden;background:var(--navy);color:#fff;padding:112px 24px 58px;min-height:590px}
.kch-photo{position:absolute;inset:0 0 0 auto;width:100%;height:100%;object-fit:cover;object-position:right 10%;z-index:-3}
.kch-shade{position:absolute;inset:0;z-index:-2;background:linear-gradient(180deg,rgba(11,41,82,.88) 0%,rgba(11,41,82,.45) 25%,rgba(11,41,82,.70) 70%,#0b2952 100%),linear-gradient(90deg,#0b2952 0%,rgba(11,41,82,.80) 37%,rgba(11,41,82,.36) 100%)}
.kch-content{position:relative;z-index:3;max-width:1120px;margin:0 auto;text-align:center}
.kch-eyebrow{font-size:12px;letter-spacing:.08em;color:#d7e8f7;font-weight:600;text-transform:uppercase}
.kch-content h1{font-size:clamp(37px,4.5vw,62px);font-weight:700;line-height:1.035;letter-spacing:-.045em;margin:16px auto;max-width:1020px;color:#fff}
.kch-content h1 span{color:#c4e4ff;letter-spacing:inherit}
.kch-lead{max-width:670px;margin:0 auto 26px;color:#e7f0fa;font-size:17px;line-height:1.55}
.kch-search-zone{max-width:730px;margin:auto;position:relative;z-index:5}
.kch-search{display:flex;align-items:center;gap:12px;border:1px solid #ffffff69;background:#fff;color:var(--navy);padding:6px 6px 6px 18px;border-radius:16px;box-shadow:0 10px 35px #071a3440;transition:box-shadow .2s}
.kch-search:focus-within{box-shadow:0 0 0 4px #6daada66,0 12px 30px #071a3438}
.kch-search-icon{width:23px;height:23px;flex:none;color:var(--steel)}
.kch-search input{flex:1;min-width:0;outline:none;border:0;background:transparent;padding:11px 0;color:var(--navy);font-size:17px;line-height:1.4}
.kch-search input::placeholder{color:#66798d}
.kch-search input::-webkit-search-cancel-button{display:none}
.kch-submit{display:grid;place-items:center;width:48px;height:48px;flex:none;border-radius:11px;color:white;background:linear-gradient(145deg,var(--steel),var(--navy));cursor:pointer}
.kch-clear{font-size:24px;color:var(--steel);width:28px;flex:none;cursor:pointer}
.kch-suggestions{position:relative;overflow:hidden;text-align:left;background:#fff;color:var(--navy);border:1px solid var(--border);border-radius:14px;margin-top:7px;box-shadow:0 15px 40px #071a3459}
.kch-suggest-heading{font-size:10px;letter-spacing:.08em;font-weight:700;color:var(--steel);padding:12px 16px 7px}
.kch-option{display:flex;align-items:center;gap:11px;width:100%;padding:12px 16px;border-top:1px solid #e6eef7;text-align:left;cursor:pointer}
.kch-option svg{flex:none;color:var(--steel)}
.kch-option strong{flex:1;min-width:0;font-size:14px;overflow-wrap:anywhere}
.kch-option small{font-size:11px;color:var(--ink-subtle);max-width:34%;text-align:right}
.kch-option:hover,.kch-option.active{background:var(--surface-strong)}
.kch-no-results{padding:13px 16px;font-size:13px;color:var(--ink-subtle)}
.kch-search-note{margin:10px auto 0;font-size:12px;color:#d5e6f7}
.kch-tiles{max-width:850px;margin:26px auto 0;display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:12px}
.kch-tile{border:1px solid #d7e9ff65;background:linear-gradient(145deg,#ffffff23,#b3d8ff0c);backdrop-filter:blur(10px);color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;border-radius:15px;min-height:99px;padding:12px 5px;font-weight:600;font-size:15px;box-shadow:0 6px 18px #071a341a;cursor:pointer;transition:background .2s,transform .2s}
.kch-tile svg{color:#e1efff}.kch-tile:hover{transform:translateY(-2px);background:#ffffff35;border-color:#c5e3ff}.kch-tile:focus-visible,.kch-chip:focus-visible,.kch-submit:focus-visible{outline:2px solid #b8ddff;outline-offset:3px}
.kch-more,.kch-quick{display:flex;flex-wrap:wrap;justify-content:center;align-items:center;gap:8px;max-width:920px;margin:18px auto 0}
.kch-quick>span{font-size:12px;color:#e1efff;margin-right:4px}
.kch-chip{color:#fff;border:1px solid #d6e8ff66;background:#ffffff10;border-radius:99px;padding:6px 13px;font-size:12px;font-weight:500;cursor:pointer}.kch-chip:hover{background:#ffffff2e}

@media(max-width:639px){
.kch-hero{padding:89px 16px 36px;min-height:0}
.kch-photo{width:100%;object-position:65% 12%}
.kch-shade{background:linear-gradient(180deg,#0b2952b8 0%,#0b29528a 24%,#0b2952c9 63%,#0b2952 100%),linear-gradient(90deg,#0b295255,#0b295233)}
.kch-eyebrow{font-size:10px;letter-spacing:.055em}
.kch-content h1{font-size:clamp(31px,8.3vw,44px);margin:13px auto;line-height:1.06}
.kch-desktop-br{display:none}.kch-lead{font-size:14px;line-height:1.5;margin-bottom:20px}
.kch-search{padding:5px 5px 5px 12px;gap:7px;border-radius:13px}.kch-search input{font-size:16px;padding:9px 0}.kch-search-icon{width:19px;height:19px}.kch-submit{width:42px;height:42px;border-radius:9px}
.kch-search-note{font-size:11px}.kch-tiles{gap:6px;margin-top:20px}.kch-tile{min-height:77px;gap:7px;font-size:10px;padding:8px 2px;border-radius:10px}.kch-tile svg{width:23px;height:23px}
.kch-quick{gap:6px;margin-top:15px}.kch-quick>span{width:100%;margin:0 0 2px}.kch-chip{font-size:11px;padding:6px 10px}
.kch-option{padding:10px;gap:8px}.kch-option strong{font-size:12px}.kch-option small{font-size:10px}
}
@media(prefers-reduced-motion:reduce){.kch-tile,.kch-search{transition:none}}

/* Straight edge and founder section aligned with the content grid. */
.kch-hero{border-bottom:1px solid var(--border)}
section[aria-labelledby="founder-heading"]{box-sizing:border-box;width:calc(100% - 48px);max-width:1216px;margin-inline:auto;padding-inline:0}
@media(min-width:1024px){section[aria-labelledby="founder-heading"]{width:calc(100% - 64px)}}
@media(max-width:639px){section[aria-labelledby="founder-heading"]{width:calc(100% - 40px)}}
</style>
  </head>
